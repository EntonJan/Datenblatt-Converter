name: EXE bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pytest
      - name: Tests
        run: python -m pytest -q
      - name: EXE bauen
        run: pyinstaller --noconfirm --clean packaging/datenblatt-converter.spec
      - name: Selbsttest der fertigen EXE
        shell: pwsh
        run: |
          $env:EPS_CONVERTER_HOME = "$env:RUNNER_TEMP\eps"
          $ziel = "$env:RUNNER_TEMP\selbsttest"
          $p = Start-Process -FilePath "dist\Datenblatt-Converter.exe" -ArgumentList "--selbsttest", $ziel -Wait -PassThru
          Get-Content "$ziel\selbsttest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path "$ziel\d999999.pdf")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Datenblatt-Converter
          path: dist/Datenblatt-Converter.exe
      - name: Version lesen und prüfen, ob es dafür schon ein Release gibt
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path src/eps_converter/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          git fetch --tags --quiet
          if (git tag -l "v$v") { "neu=false" >> $env:GITHUB_OUTPUT } else { "neu=true" >> $env:GITHUB_OUTPUT }
      - name: Release anlegen (nur wenn die Versionsnummer neu ist)
        if: github.ref == 'refs/heads/main' && steps.version.outputs.neu == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Datenblatt-Converter ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/Datenblatt-Converter.exe
          generate_release_notes: true
